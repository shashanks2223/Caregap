version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: caregap-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caregap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caregap_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-caregap_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caregap_user -d caregap_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caregap-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-caregap_user}:${POSTGRES_PASSWORD:-caregap_secret_2026}@db:5432/${POSTGRES_DB:-caregap_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-caregap-production-secret-key-change-me-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost", "http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caregap-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:

